version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: watchman_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: watchman_user
      POSTGRES_PASSWORD: watchman_pass
      POSTGRES_DB: watchman_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchman_user -d watchman_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: watchman_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@watchman.local
      PGADMIN_DEFAULT_PASSWORD: pgadmin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
